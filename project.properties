# project.properties
# Ortak proje ayarları; Git'te tutulur. Gizli değer bu dosyaya yazılmaz.

project.name = Test_Playground
language.version = 1.0

# Ortamlar
env.test.baseUrl = http://www.uitestingplayground.com/
env.default = test

# Koşum
timeout = 10s
onFailure = stop
onDialog = accept
delay = 0ms

# Ekran görüntüsü: kapalıysa hiçbir dosya yazılmaz
screenshot.onFailure = true
